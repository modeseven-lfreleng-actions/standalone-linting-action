---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# standalone-linting-action
#
# Runs pre-commit hooks with prek <https://github.com/j178/prek>,
# standalone from pre-commit.ci. The primary use case is hooks that
# pre-commit.ci cannot run: hooks needing network access at scan time,
# or hooks whose environments exceed the pre-commit.ci size limits.
#
# Default behaviour (no inputs): parse the repository's
# .pre-commit-config.yaml, take the hook ids listed under 'ci.skip',
# and run exactly those hooks. When 'ci.skip' is empty or absent the
# action succeeds without running anything.
#
# Other modes:
#   * hooks: '<ids>'        run an explicit subset of hooks
#   * skip_hooks: '<ids>'   EXCLUDE ids from whichever set runs
#     (passed to prek as '--skip' under run_all_hooks; subtracted
#     from the resolved list in per-hook mode)
#   * run_all_hooks: 'true' run every hook in the configuration
#   * config_path/config_url select an alternate configuration file,
#     which runs in full unless 'hooks' names a subset
#   * commit_range: '<from>..<to>' ALSO runs the selected hooks at
#     the commit-msg stage, once per commit in the range, against
#     that commit's message
#
# Rust projects (a tracked Cargo.toml under path_prefix): before the
# hooks run, the action installs the toolchain the project selects
# if it is missing, and adds rust_components to it, so 'language:
# system' hooks calling 'cargo fmt' or 'cargo clippy' find them.
# rust_toolchain_setup turns that off, or on for any project.
#
# Security posture:
#   * No secrets required; an optional github_token is only exported
#     to hooks that need authenticated API access.
#   * All variable data reaches shell steps through 'env', never
#     through expression interpolation inside 'run' blocks.
#   * Hook ids are allow-listed to [A-Za-z0-9._-], so a configuration
#     cannot smuggle shell metacharacters onto the prek command line.
#     skip_hooks is held to the same rule: '--skip' takes its value as
#     a separate argument, so there is no '--' terminator to fall back
#     on there.
#   * config_path is confined to the workspace or the runner temp
#     directory (symlink escapes rejected via realpath).
#   * commit_range is allow-listed per side, resolved to commit ids
#     behind '--end-of-options', and only those ids reach git again.
#   * config_url must be HTTPS, downloads to a private mktemp
#     directory (never overwriting repository files, and never a
#     predictable path a symlink could redirect), is size- and
#     time-capped, and supports sha256 integrity pinning.
#   * uvx runs with '--no-config'. Measured against uv 0.11.21,
#     'uv tool run' does NOT discover a working-directory uv.toml or
#     '[tool.uv]' the way 'uv run' does -- so a fork-committed one
#     cannot redirect where prek installs from today. The flag makes
#     that a stated property rather than an incidental one, since
#     nothing in uv's contract promises the asymmetry will hold.
name: '🧹 Standalone Linting Action'
description: 'Runs pre-commit linting hooks with prek, outside pre-commit.ci'

inputs:
  # Optional
  hooks:
    description: >-
      Space or comma separated hook ids to run from the configuration.
      A hook's 'alias' works here as readily as its id, since prek's
      selectors match either. Names must match [A-Za-z0-9._-]; the
      action rejects anything else rather than pass it to a shell.
      Empty selects the default mode: run the hooks listed under
      'ci.skip' in the configuration file.
    required: false
    default: ''
  run_all_hooks:
    description: >-
      Set 'true' to run every hook in the configuration file.
      Mutually exclusive with the hooks input. Supplying config_path
      or config_url implies this.
    required: false
    default: 'false'
  per_hook_runs:
    description: >-
      Set 'true' to invoke prek once per selected hook, giving the job
      summary one row per hook so a failure is attributable at a
      glance. The default runs the whole selection in ONE prek
      invocation, which is faster: prek runs hooks concurrently and
      shares environments, while each extra invocation pays its own
      startup.

      prek names the failing hook in its own output either way, so
      this buys the summary table rather than the diagnosis. No
      effect when run_all_hooks is set, which is a single invocation
      by nature.

      Applies to the pre-commit stage alone. With commit_range, each
      commit's message is checked by ONE invocation running every
      selected commit-msg hook, whatever this is set to: per hook and
      per commit would multiply the runs, and prek's output still
      names the hook that failed.
    required: false
    default: 'false'
  commit_range:
    description: >-
      A '<from>..<to>' revision range, such as '<base sha>..<head sha>'
      for a pull request. When set, the selected hooks ALSO run at the
      commit-msg stage, once per commit in the range, merges included,
      against that commit's message. This is how gitlint and other
      commit-msg hooks reach CI; without it they never run. The
      commit-msg stage runs once per commit whatever per_hook_runs
      says, and the summary gets one row per commit.

      Every commit in the range must be present. The action's own
      checkout fetches full history when this is set, and a range
      with an endpoint missing from the clone, one in a shallow clone
      whose ends reach a boundary, or one selecting no commits is
      refused rather than linted in part. Each side must match
      [A-Za-z0-9][A-Za-z0-9._/~^-]*.
    required: false
    default: ''
  skip_hooks:
    description: >-
      Space or comma separated hook ids or ALIASES to EXCLUDE from the
      run, the inverse of the hooks input. Held to the same id rules.
      This is how a caller expresses 'run everything except these',
      which the hooks input cannot: hooks names a subset to include.

      Combines with run_all_hooks (run everything but these) and with
      hooks (run these, minus any also named here) alike. Excluding
      every hook is a clean no-op in both.

      prek resolves the matching, on every path, so an exclusion may
      name a hook's 'alias' as readily as its id. In per-hook mode
      the action asks prek which hooks survive, drops the ones that
      will not run, and forwards the exclusions to each invocation --
      so hooks_run reports what ran, and a hook id appearing twice
      keeps the instance that was not excluded.

      Two things stop a hook running, and both remove it from
      hooks_run. One is an exclusion prek confirms it applied. The
      other is stage: a run reaches pre-commit hooks, manual ones
      when named, and commit-msg ones when commit_range is set, so a
      hook left with only pre-push instances -- or commit-msg ones,
      without a range -- is dropped rather than reported as a pass it
      never earned.

      An ambient SKIP or PREK_SKIP in the environment is merged
      rather than overridden: prek reads those only when no CLI
      '--skip' is present, so passing this input alone would
      suppress them and run a hook the environment had excluded.
      PREK_SKIP wins over SKIP when both are set, matching prek.

      prek treats an id matching no hook as a no-op, so a stale entry
      weakens the run without failing it; keep the list current. A
      requested hook that the configuration does not define is NOT
      silently dropped -- it reaches prek, which refuses it.
    required: false
    default: ''
  config_path:
    description: >-
      Path to the pre-commit configuration file. Relative paths
      resolve inside the repository workspace; absolute paths must
      live under the runner temp directory (for configurations staged
      by an orchestrating workflow). Empty uses
      <path_prefix>/.pre-commit-config.yaml. Implies run_all_hooks
      unless the hooks input names a subset.
    required: false
    default: ''
  config_url:
    description: >-
      HTTPS download URL for the pre-commit configuration file.
      Downloaded to a private directory under the runner temp
      directory; never overwrites repository files. Mutually
      exclusive with config_path. Implies run_all_hooks unless the
      hooks input names a subset.
    required: false
    default: ''
  config_sha256:
    description: >-
      Expected SHA-256 checksum of the file fetched from config_url.
      Strongly recommended whenever config_url is set.
    required: false
    default: ''
  path_prefix:
    description: 'Directory location containing project code'
    required: false
    default: '.'
  branch_name:
    # Prevents linting errors that mandate changes be made on a branch
    description: 'Checkout this branch name prior to running linting'
    required: false
    default: ''
  no_checkout:
    description: 'Do not checkout local repository; used for testing'
    required: false
    default: 'false'
  github_token:
    description: >-
      Optional token exported to hooks as GITHUB_TOKEN/GH_TOKEN, for
      linters that call the GitHub API (e.g. gha-workflow-linter).
      Pass secrets.GITHUB_TOKEN or github.token; never a PAT with
      broader scope than the job needs.
    required: false
    default: ''
  prek_version:
    description: >-
      Version of prek used to run the hooks (X.Y.Z). Must be 0.2.20
      or newer, where prek gained the JSON hook listing, selector
      support for list, and the manual-stage fallback this action
      reads.
    required: false
    default: '0.4.14'
  rust_toolchain_setup:
    description: >-
      Prepare the Rust toolchain before the hooks run: 'auto' when
      path_prefix holds a tracked Cargo.toml, 'true' for any project,
      'false' never. Preparation resolves the toolchain the project
      selects (rust-toolchain.toml, else the rustup default) in the
      directory prek runs hooks from and in path_prefix, installs it
      when missing, and adds rust_components to it. A path-based or
      linked ('rustup toolchain link') toolchain gets a warning and no
      preparation. Needs rustup: without it 'auto' skips with a
      notice and 'true' fails.
    required: false
    default: 'auto'
  rust_components:
    description: >-
      Space or comma separated rustup components to add to each
      prepared toolchain. Names must match [A-Za-z0-9][A-Za-z0-9_-]*.
      Empty installs a missing toolchain without adding components.
    required: false
    default: 'rustfmt clippy'

outputs:
  prek_runs:
    description: >-
      How many 'prek run' commands the action issued: 1 for a whole
      configuration or a selection run together, one per hook under
      per_hook_runs, plus one per commit when commit_range has a
      commit-msg stage to run, and empty when there was nothing to do.
      Reports the execution SHAPE, which hooks_run cannot -- that names
      the same set whichever way the hooks were invoked.

      Counts runs alone. The action also issues 'prek list' to resolve
      exclusions and to check requested names, and those are not
      included: they decide what to run rather than running it.
    value: ${{ steps.lint.outputs.prek_runs }}
  config_file:
    description: 'Resolved path of the linting configuration file'
    value: ${{ steps.resolve.outputs.config_file }}
  hooks_run:
    description: >-
      Space-separated hook names the action ran, echoing whichever
      form the caller asked for -- an id, or an alias where one was
      named; 'all' when run_all_hooks was set; empty when there was
      nothing to do, and empty when the action refused the selection
      before running it.
    value: ${{ steps.lint.outputs.hooks_run }}
  rust_toolchains:
    description: >-
      Space-separated names of the Rust toolchains the action
      prepared. Empty when it prepared none: rust_toolchain_setup
      'false'; 'auto' with no tracked Cargo.toml or no rustup; every
      selected toolchain path-based or linked; or no hook to run.
    value: ${{ steps.rust.outputs.toolchains }}

runs:
  using: 'composite'
  steps:
    - name: 'Checkout repository'
      # yamllint disable-line rule:line-length
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        # A commit range needs its commits present. The default depth
        # of one holds a single commit, so fetch everything instead.
        fetch-depth: ${{ inputs.commit_range == '' && '1' || '0' }}
      if: inputs.no_checkout != 'true'

    - name: 'Validate inputs'
      # Located by this id in tests/test-validate-inputs.sh, which
      # runs the step on its own to pin each refusal to its guard.
      id: validate
      shell: bash
      env:
        INPUT_HOOKS: ${{ inputs.hooks }}
        INPUT_SKIP_HOOKS: ${{ inputs.skip_hooks }}
        INPUT_RUN_ALL_HOOKS: ${{ inputs.run_all_hooks }}
        INPUT_PER_HOOK_RUNS: ${{ inputs.per_hook_runs }}
        INPUT_CONFIG_PATH: ${{ inputs.config_path }}
        INPUT_CONFIG_URL: ${{ inputs.config_url }}
        INPUT_CONFIG_SHA256: ${{ inputs.config_sha256 }}
        INPUT_PATH_PREFIX: ${{ inputs.path_prefix }}
        INPUT_BRANCH_NAME: ${{ inputs.branch_name }}
        INPUT_PREK_VERSION: ${{ inputs.prek_version }}
        INPUT_COMMIT_RANGE: ${{ inputs.commit_range }}
        INPUT_RUST_TOOLCHAIN_SETUP: ${{ inputs.rust_toolchain_setup }}
        INPUT_RUST_COMPONENTS: ${{ inputs.rust_components }}
      run: |
        # Validate inputs
        set -euo pipefail
        errors=0
        err() { echo "::error::$1 ❌"; errors=1; }

        # Reject control characters (notably CR/LF) in every string
        # input, before any other check.
        #
        # Two reasons. First, 'grep -qE ^...$' anchors per LINE, so a
        # multi-line value whose lines each match slips past the
        # patterns below. Second, a resolved path carrying a newline
        # would corrupt the single-line 'name=value' records this
        # action writes to GITHUB_OUTPUT, truncating a value or
        # injecting an extra record. A bash pattern match sees the
        # whole value, so it catches what the line-oriented tools
        # cannot.
        check_clean() {
          # $1=value $2=label
          if [[ "$1" == *[$'\n\r\t\v\f']* ]]; then
            err "$2 must not contain control characters"
            return 1
          fi
          return 0
        }

        check_clean "$INPUT_HOOKS" 'hooks' || true
        check_clean "$INPUT_SKIP_HOOKS" 'skip_hooks' || true
        check_clean "$INPUT_CONFIG_PATH" 'config_path' || true
        check_clean "$INPUT_CONFIG_URL" 'config_url' || true
        check_clean "$INPUT_PATH_PREFIX" 'path_prefix' || true
        check_clean "$INPUT_BRANCH_NAME" 'branch_name' || true
        check_clean "$INPUT_COMMIT_RANGE" 'commit_range' || true
        check_clean "$INPUT_RUST_COMPONENTS" 'rust_components' || true
        # Both of these are validated by a line-anchored 'grep'
        # below, so both need this first for the reason given above.
        #
        # prek_version reaches three places past that check: the
        # 'uvx prek@...' argument, the 'IFS=. read' that derives the
        # version floor -- which takes the FIRST line and so passes
        # on the valid part -- and the actions/cache key, where a
        # newline has no business at all.
        #
        # config_sha256 fails closed today rather than opening a
        # hole: 'sha256sum --check --strict' refuses a malformed
        # record. But it refuses it as 'FAILED open or read' against
        # a filename built from the second line, which tells a caller
        # nothing about the input they got wrong. Refusing it here
        # names the input instead.
        check_clean "$INPUT_PREK_VERSION" 'prek_version' || true
        check_clean "$INPUT_CONFIG_SHA256" 'config_sha256' || true
        [ "$errors" -eq 0 ] || exit 1

        case "$INPUT_RUN_ALL_HOOKS" in
          true|false) ;;
          *) err "run_all_hooks must be 'true' or 'false'" ;;
        esac
        # Checked rather than tested for truthiness later: a value
        # such as 'yes' would otherwise read as false and quietly
        # select the opposite execution shape.
        case "$INPUT_PER_HOOK_RUNS" in
          true|false) ;;
          *) err "per_hook_runs must be 'true' or 'false'" ;;
        esac
        case "$INPUT_RUST_TOOLCHAIN_SETUP" in
          auto|true|false) ;;
          *) err "rust_toolchain_setup must be 'auto', 'true' or 'false'" ;;
        esac
        # Each component reaches 'rustup component add' behind '--',
        # and the leading alphanumeric keeps it from reading as an
        # option should that terminator ever go. Checked whether or
        # not the project turns out to use Rust, so a bad value fails
        # here rather than in the first Rust repository to call it.
        # The message names the input without echoing the value.
        if [ -n "$INPUT_RUST_COMPONENTS" ]; then
          component_rule='[A-Za-z0-9][A-Za-z0-9_-]*, up to 64 characters'
          read -ra rust_components <<< "${INPUT_RUST_COMPONENTS//,/ }"
          for component in "${rust_components[@]}"; do
            if ! printf '%s' "$component" |
              grep -qE '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'; then
              err "rust_components entries must match $component_rule"
              break
            fi
          done
        fi
        if [ "$INPUT_RUN_ALL_HOOKS" = 'true' ] && [ -n "$INPUT_HOOKS" ]
        then
          err 'hooks and run_all_hooks are mutually exclusive'
        fi
        # Every hook id must START with an alphanumeric. A leading '-'
        # would otherwise reach the prek command line as an OPTION:
        # 'prek run --help' prints help and exits 0, so the action
        # would report a hook as passed without ever running it.
        #
        # 'read -ra' splits on IFS WITHOUT pathname expansion. An
        # unquoted expansion would glob first, so 'hooks: *' would
        # validate the file names in the checkout rather than the
        # literal '*' the resolver goes on to use.
        if [ -n "$INPUT_HOOKS" ]; then
          read -ra hook_ids <<< "${INPUT_HOOKS//,/ }"
          for hook_id in "${hook_ids[@]}"; do
            if ! printf '%s' "$hook_id" |
              grep -qE '^[A-Za-z0-9][A-Za-z0-9._-]*$'; then
              err "invalid hook id: $hook_id"
            fi
          done
        fi
        # skip_hooks reaches the same command line, so it is held to
        # the same rule. A leading '-' here would be read as a prek
        # option just as readily, and '--skip' takes its value as a
        # separate argument, so there is no '--' terminator to lean
        # on for this one.
        if [ -n "$INPUT_SKIP_HOOKS" ]; then
          read -ra skip_ids <<< "${INPUT_SKIP_HOOKS//,/ }"
          for skip_id in "${skip_ids[@]}"; do
            if ! printf '%s' "$skip_id" |
              grep -qE '^[A-Za-z0-9][A-Za-z0-9._-]*$'; then
              err "invalid hook id in skip_hooks: $skip_id"
            fi
          done
        fi
        if [ -n "$INPUT_CONFIG_PATH" ] && [ -n "$INPUT_CONFIG_URL" ]
        then
          err 'config_path and config_url are mutually exclusive'
        fi
        if [ -n "$INPUT_CONFIG_URL" ]; then
          case "$INPUT_CONFIG_URL" in
            https://?*) ;;
            *) err 'config_url must be an https:// URL' ;;
          esac
          if ! printf '%s' "$INPUT_CONFIG_URL" |
            grep -qE '^https://[A-Za-z0-9._~:/?#@$&()*+,;=%-]+$'; then
            err 'config_url contains unsupported characters'
          fi
        fi
        if [ -n "$INPUT_CONFIG_SHA256" ]; then
          if [ -z "$INPUT_CONFIG_URL" ]; then
            err 'config_sha256 requires config_url'
          fi
          if ! printf '%s' "$INPUT_CONFIG_SHA256" |
            grep -qE '^[0-9a-fA-F]{64}$'; then
            err 'config_sha256 must be a 64-character hex digest'
          fi
        fi
        if ! printf '%s' "$INPUT_PREK_VERSION" |
          grep -qE '^[0-9]{1,6}\.[0-9]{1,6}\.[0-9]{1,6}$'; then
          err 'prek_version must be X.Y.Z, each part 1-6 digits'
        else
          # The resolver depends on three prek features, and the
          # newest sets the floor:
          #
          #   0.0.25  'list --output-format json'
          #   0.2.0   project and hook SELECTORS, so 'list --skip'
          #   0.2.20  naming a hook falls back to the manual stage
          #
          # The last is what 'manual' in the runnable stage set below
          # relies on. An older pin would either fail every exclusion
          # query or quietly disagree about which hooks a run
          # reaches, so refuse it here with a reason instead.
          IFS='.' read -r prek_major prek_minor prek_patch \
            <<< "$INPUT_PREK_VERSION"
          # '10#' forces base ten: a field written '08' would
          # otherwise be read as octal and abort the arithmetic. The
          # digit bound above keeps each field well inside what bash
          # arithmetic holds -- a twenty-digit field wraps to a
          # smaller number rather than failing, so '0.0.9999...'
          # would compare as something else entirely.
          prek_major=$((10#$prek_major))
          prek_minor=$((10#$prek_minor))
          prek_patch=$((10#$prek_patch))
          # Compared component by component, NOT packed into a single
          # number. Packing needs a fixed radix, and the fields are
          # not bounded by it: at radix 100000 the version
          # '0.1.100020' packs to 200020, exactly what '0.2.20'
          # packs to, so it passed a floor that every 0.1.x predates.
          if [ "$prek_major" -eq 0 ] &&
            { [ "$prek_minor" -lt 2 ] ||
              { [ "$prek_minor" -eq 2 ] &&
                [ "$prek_patch" -lt 20 ]; }; }; then
            err 'prek_version must be 0.2.20 or newer'
          fi
        fi
        if [ -n "$INPUT_BRANCH_NAME" ]; then
          if ! printf '%s' "$INPUT_BRANCH_NAME" |
            grep -qE '^[A-Za-z0-9._/-]+$'; then
            err 'branch_name contains unsupported characters'
          fi
          case "/$INPUT_BRANCH_NAME/" in
            */../*) err "branch_name must not contain '..'" ;;
          esac
        fi
        # Each side reaches 'git rev-parse', so it is held to a
        # revision allow-list: names, ids, and the '~'/'^' suffixes
        # a range such as 'HEAD~3..HEAD' needs. A leading
        # alphanumeric keeps a side from reading as an option.
        #
        # Split at the FIRST '..'. git's symmetric difference 'a...b'
        # then leaves '.b', which the leading alphanumeric refuses. A
        # second '..', as in 'a..b..c', is refused outright: '.' is
        # legal inside a name, so 'b..c' would pass the pattern.
        if [ -n "$INPUT_COMMIT_RANGE" ]; then
          case "$INPUT_COMMIT_RANGE" in
            *..*)
              for side in "${INPUT_COMMIT_RANGE%%..*}" \
                "${INPUT_COMMIT_RANGE#*..}"; do
                case "$side" in
                  *..*) err "invalid revision in commit_range: $side" ;;
                  *)
                    if ! printf '%s' "$side" |
                      grep -qE '^[A-Za-z0-9][A-Za-z0-9._/~^-]*$'; then
                      err "invalid revision in commit_range: $side"
                    fi
                    ;;
                esac
              done
              ;;
            *) err "commit_range must be '<from>..<to>'" ;;
          esac
        fi

        # Path containment: reject absolute paths and '..' segments,
        # then resolve symlinks and confirm the real path stays inside
        # the permitted root(s).
        ws=$(realpath -e -- "$GITHUB_WORKSPACE")
        tmp=$(realpath -e -- "$RUNNER_TEMP")

        case "$INPUT_PATH_PREFIX" in
          /*) err 'path_prefix must be a relative path' ;;
          *)
            case "/$INPUT_PATH_PREFIX/" in
              */../*) err "path_prefix must not contain '..'" ;;
              *)
                if abs=$(realpath -e -- "$ws/$INPUT_PATH_PREFIX" \
                  2>/dev/null); then
                  case "$abs" in
                    "$ws"|"$ws"/*)
                      if [ ! -d "$abs" ]; then
                        err 'path_prefix is not a directory'
                      fi
                      ;;
                    *) err 'path_prefix escapes the workspace' ;;
                  esac
                else
                  err "path_prefix is not a valid directory:" \
                    "$INPUT_PATH_PREFIX"
                fi
                ;;
            esac
            ;;
        esac

        if [ -n "$INPUT_CONFIG_PATH" ]; then
          case "$INPUT_CONFIG_PATH" in
            /*)
              # Absolute paths permitted only under the runner temp
              # directory, for configurations staged by a workflow.
              if abs=$(realpath -e -- "$INPUT_CONFIG_PATH" \
                2>/dev/null); then
                case "$abs" in
                  "$tmp"/*) ;;
                  *) err 'absolute config_path must live under' \
                    'the runner temp directory' ;;
                esac
              else
                err "config_path does not exist: $INPUT_CONFIG_PATH"
              fi
              ;;
            *)
              case "/$INPUT_CONFIG_PATH/" in
                */../*) err "config_path must not contain '..'" ;;
                *)
                  if abs=$(realpath -e -- "$ws/$INPUT_CONFIG_PATH" \
                    2>/dev/null); then
                    case "$abs" in
                      "$ws"/*) ;;
                      *) err 'config_path escapes the workspace' ;;
                    esac
                  else
                    err "config_path does not exist:" \
                      "$INPUT_CONFIG_PATH"
                  fi
                  ;;
              esac
              ;;
          esac
        fi

        [ "$errors" -eq 0 ] || exit 1

    - name: 'Download remote configuration'
      id: download
      if: inputs.config_url != ''
      shell: bash
      env:
        INPUT_CONFIG_URL: ${{ inputs.config_url }}
        INPUT_CONFIG_SHA256: ${{ inputs.config_sha256 }}
      run: |
        # Download remote configuration
        set -euo pipefail
        # A private directory with an unpredictable name, NOT a fixed
        # path: 'curl --output' follows an existing symlink, so a
        # pre-created path could otherwise redirect the write into the
        # workspace.
        dir=$(mktemp -d "$RUNNER_TEMP/standalone-linting.XXXXXXXX")
        chmod 700 "$dir"
        target="$dir/remote-config.yaml"
        curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
          --location --max-redirs 3 --max-filesize 1048576 \
          --max-time 60 --output "$target" "$INPUT_CONFIG_URL"
        if [ -n "$INPUT_CONFIG_SHA256" ]; then
          digest=$(printf '%s' "$INPUT_CONFIG_SHA256" |
            tr '[:upper:]' '[:lower:]')
          echo "$digest  $target" | sha256sum --check --strict -
          echo 'Remote configuration checksum verified ✅'
        else
          echo '::warning::config_url fetched without config_sha256;' \
            'pin a checksum to guarantee integrity'
        fi
        echo "config_file=$target" >> "$GITHUB_OUTPUT"

    - name: 'Set up uv'
      # yamllint disable-line rule:line-length
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: '0.12.4'

    - name: 'Resolve configuration and hooks'
      id: resolve
      shell: bash
      env:
        INPUT_HOOKS: ${{ inputs.hooks }}
        INPUT_SKIP_HOOKS: ${{ inputs.skip_hooks }}
        INPUT_RUN_ALL_HOOKS: ${{ inputs.run_all_hooks }}
        INPUT_CONFIG_PATH: ${{ inputs.config_path }}
        INPUT_CONFIG_URL: ${{ inputs.config_url }}
        INPUT_PATH_PREFIX: ${{ inputs.path_prefix }}
        # Needed by the run-all skip_hooks precheck, which asks
        # 'prek list' what survives the exclusions.
        INPUT_PREK_VERSION: ${{ inputs.prek_version }}
        DOWNLOADED_CONFIG: ${{ steps.download.outputs.config_file }}
        # A range makes commit-msg a stage the run reaches, which the
        # exclusion comparison and the run-all precheck both weigh.
        INPUT_COMMIT_RANGE: ${{ inputs.commit_range }}
      run: |
        # Resolve configuration and hooks
        set -euo pipefail
        if [ -n "$INPUT_CONFIG_URL" ]; then
          cfg="$DOWNLOADED_CONFIG"
        elif [ -n "$INPUT_CONFIG_PATH" ]; then
          case "$INPUT_CONFIG_PATH" in
            /*) cfg="$INPUT_CONFIG_PATH" ;;
            *) cfg="$GITHUB_WORKSPACE/$INPUT_CONFIG_PATH" ;;
          esac
        else
          cfg="$GITHUB_WORKSPACE/$INPUT_PATH_PREFIX"
          cfg="$cfg/.pre-commit-config.yaml"
        fi
        if ! cfg=$(realpath -e -- "$cfg"); then
          echo '::error::No linting configuration file found ❌'
          exit 1
        fi
        # The resolved path goes into a single-line GITHUB_OUTPUT
        # record. A file name carrying a newline would truncate the
        # value or inject a further record, so refuse it here rather
        # than corrupt the step outputs.
        if [[ "$cfg" == *[$'\n\r']* ]]; then
          echo '::error::configuration path contains a newline ❌'
          exit 1
        fi
        echo "Linting configuration: $cfg 💬"

        hooks=''
        run_all='false'
        run_needed='true'
        no_work_reason=''

        # The EFFECTIVE exclusion set: skip_hooks plus whatever the
        # environment already asked for.
        #
        # prek honours 'SKIP'/'PREK_SKIP' only when no CLI '--skip' is
        # present, so passing skip_hooks on the command line SUPPRESSES
        # an ambient value -- silently running a hook the caller had
        # already excluded. Merging the two preserves both, and keeps
        # one list behind every decision below: the filtered listing
        # that computes what to drop, and the invocations that run.
        #
        # Precedence follows prek, which honours PREK_SKIP whenever
        # the variable EXISTS -- empty included, where an empty value
        # disables the SKIP fallback entirely:
        #
        #   $ PREK_SKIP='' SKIP=root-hook prek list
        #   frontend:eslint
        #   .:root-hook                    # nothing skipped
        #
        # Hence the unset-only expansion. A ':-' default would read
        # an explicitly empty PREK_SKIP as absent and apply SKIP,
        # against what the caller asked for.
        ambient_skips="${PREK_SKIP-${SKIP-}}"

        # Built as an ARRAY, because the two sources do not share a
        # grammar and a joined string cannot be re-split correctly.
        effective_list=()

        # skip_hooks: space OR comma separated, as documented, and
        # validated to hook ids -- which cannot contain a space, so
        # IFS splitting is exact here.
        if [ -n "$INPUT_SKIP_HOOKS" ]; then
          read -ra skip_hook_items <<< "${INPUT_SKIP_HOOKS//,/ }"
          for skip_item in "${skip_hook_items[@]}"; do
            [ -n "$skip_item" ] && effective_list+=("$skip_item")
          done
        fi

        if [ -n "$ambient_skips" ]; then
          # Control characters on the WHOLE value, before splitting.
          # A value spelling 'valid<newline>hooks=...' would
          # otherwise validate its first line while the remainder
          # travelled into the resolver's output, where a newline
          # starts a new record and can overwrite another.
          if [[ "$ambient_skips" == *[$'\n\r\t\v\f']* ]]; then
            echo "::error::SKIP/PREK_SKIP must not contain control" \
              "characters ❌"
            exit 1
          fi
          # prek splits these on COMMAS ALONE and trims each item, so
          # a selector may contain spaces -- a workspace project
          # directory named 'frontend app' is excluded as
          # 'frontend app/':
          #
          #   $ SKIP='root-hook, frontend app/' prek list
          #   (empty: both excluded)
          #
          # Splitting on IFS would break that into 'frontend' and
          # 'app/', and the exclusion would silently not apply.
          old_ifs="$IFS"
          IFS=','
          read -ra ambient_items <<< "$ambient_skips"
          IFS="$old_ifs"
          for ambient_item in "${ambient_items[@]}"; do
            # Trim, as prek does.
            ambient_item="${ambient_item#"${ambient_item%%[![:space:]]*}"}"
            ambient_item="${ambient_item%"${ambient_item##*[![:space:]]}"}"
            [ -n "$ambient_item" ] || continue
            # NOT held to the hook-id contract that skip_hooks is.
            # These carry prek SELECTORS, a wider grammar: 'frontend/'
            # names a project and 'frontend:eslint' a qualified hook.
            # Since this branch runs whenever the environment is set
            # -- skip_hooks or not -- an id check would fail existing
            # workspace callers before prek saw their selector.
            #
            # Refuse what cannot be forwarded safely instead: a
            # leading '-' reads as an option, and '--skip' takes its
            # value as a separate argument so no '--' terminator
            # stands behind it. Quoting covers the rest.
            case "$ambient_item" in
              -*)
                echo "::error::SKIP/PREK_SKIP entry must not start" \
                  "with '-': $ambient_item ❌"
                exit 1
                ;;
            esac
            effective_list+=("$ambient_item")
          done
        fi
        if [ -n "$INPUT_HOOKS" ]; then
          hooks=$(printf '%s' "$INPUT_HOOKS" | tr ',' ' ' |
            tr -s ' ' | sed -e 's/^ //' -e 's/ $//')
        elif [ "$INPUT_RUN_ALL_HOOKS" = 'true' ]; then
          run_all='true'
        elif [ -n "$INPUT_CONFIG_URL" ] ||
          [ -n "$INPUT_CONFIG_PATH" ]; then
          # An explicitly supplied configuration runs in full. Its
          # 'ci.skip' describes what pre-commit.ci skips for the
          # repository that owns it, which says nothing about a
          # configuration named here on purpose; falling to ci.skip
          # mode would silently run nothing for most such files.
          run_all='true'
          echo 'Explicit configuration supplied; running all hooks 💬'
        else
          # Default mode: run the hooks pre-commit.ci skips. Parse
          # ci.skip and keep only ids the configuration defines.
          #
          # '--no-config' because 'uv run' reads a 'uv.toml' from the
          # working directory, which is the checkout being linted --
          # so without it the repository under test could redirect
          # the index this action's own tooling comes from.
          hooks=$(uv run --no-config --no-project \
            --with pyyaml==6.0.2 \
            python - "$cfg" <<'PYEOF'
        import re
        import sys

        import yaml

        with open(sys.argv[1], encoding="utf-8") as handle:
            cfg = yaml.safe_load(handle) or {}
        if not isinstance(cfg, dict):
            sys.exit("configuration is not a YAML mapping")
        ci_block = cfg.get("ci") or {}
        skip = ci_block.get("skip") if isinstance(ci_block, dict) else []
        skip = [str(item) for item in (skip or [])]
        defined = []
        for repo in cfg.get("repos") or []:
            if not isinstance(repo, dict):
                continue
            for hook in repo.get("hooks") or []:
                if isinstance(hook, dict) and hook.get("id"):
                    defined.append(str(hook["id"]))
        selected = [item for item in skip if item in defined]
        for item in selected:
            # Must start alphanumeric: a leading '-' would reach the
            # prek command line as an option ('run --help' exits 0),
            # reporting a pass without running the hook.
            if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,99}", item):
                sys.exit(f"invalid hook id in ci.skip: {item!r}")
        print(" ".join(dict.fromkeys(selected)))
        PYEOF
          )
          if [ -z "$hooks" ]; then
            run_needed='false'
            no_work_reason='ci.skip lists no runnable hooks'
            echo "::notice::$no_work_reason; nothing to do ✅"
          fi
        fi

        # Subtract the exclusions from the RESOLVED list, before the
        # label and before the run loop.
        #
        # Without this the loop still iterates an excluded id, and
        # hooks_run still reports it. Measured against prek 0.4.14,
        # 'prek run --skip b -- b' exits 1 with 'No hooks found after
        # filtering', so the summary recorded a CROSS and failed the
        # run for a hook the caller asked to exclude -- while
        # hooks_run claimed it had run.
        #
        # Ask PREK which hooks survive, rather than comparing ids
        # here. '--skip' matches a hook's ALIAS as well as its id:
        #
        #   hooks:      - id: real-id
        #                 alias: friendly-name
        #   $ prek run --all-files --config cfg.yaml \
        #       --skip friendly-name
        #   other hook..............................Passed
        #
        # so string equality left an aliased exclusion running in
        # this mode while the run-all path excluded it. One input,
        # two answers, and the mode decided which -- with the
        # exclusion silently ignored in the mode that named hooks.
        #
        # 'prek list' applies the same selectors 'prek run' does, so
        # the surviving set is prek's own answer rather than a second
        # implementation of its matching rules.
        if [ "${#effective_list[@]}" -gt 0 ] &&
          [ "$run_all" != 'true' ] && [ -n "$hooks" ]; then
          list_args=()
          for skip_id in "${effective_list[@]}"; do
            list_args+=(--skip "$skip_id")
          done
          list_status=0
          # ONE query, and it carries the selectors.
          #
          # An unfiltered baseline used to supply the defined set,
          # but 'prek list' initialises hooks, and with no selectors
          # that means cloning every remote repo the configuration
          # names. A hook excluded BECAUSE it is unavailable would
          # then fail the action anyway, defeating the exclusion.
          # Measured against prek 0.4.10 with an unreachable remote:
          #
          #   $ prek list --config cfg.yaml                  exit 2
          #   $ prek list --config cfg.yaml --skip broken    exit 0
          #   $ prek run --config cfg.yaml --skip broken \
          #       -- good                      Local good hook Passed
          #
          # The defined set comes from the configuration file below
          # instead. That question is syntactic -- does the file
          # mention this name -- so the file answers it exactly,
          # while prek keeps deciding what MATCHES.
          #
          # JSON because the text form prints '<project>:<hook-id>'
          # with nothing escaped, and prek places NO restriction on
          # the shape of an id, so that line cannot be taken apart
          # reliably:
          #
          #   $ prek list --config cfg.yaml
          #   .:x:no-such-hook
          #
          # Splitting at the last colon yielded 'no-such-hook', so an
          # undefined hook of that name looked excluded and was
          # dropped unrun. An id spelling '*' defeated shell
          # tokenising the same way. JSON carries the id, and the
          # alias, as their own fields.
          #
          # Written to a FILE, not captured into a variable: prek's
          # JSON carries each hook's name, description and stage
          # list, and Linux caps a single environment string at
          # roughly 128 KiB (MAX_ARG_STRLEN).
          listing_dir=$(mktemp -d "$RUNNER_TEMP/prek-listing.XXXXXXXX")
          surviving="$listing_dir/surviving.json"
          uvx --no-config "prek@$INPUT_PREK_VERSION" \
            list --config "$cfg" --output-format json \
            "${list_args[@]+"${list_args[@]}"}" \
            > "$surviving" || list_status=$?
          if [ "$list_status" -ne 0 ]; then
            # Source-neutral: the selectors behind this query may have
            # come from skip_hooks, from an ambient SKIP/PREK_SKIP,
            # or from both, so naming the input would send a caller
            # to look at something they never set.
            echo '::error::could not resolve the hook exclusions' \
              'against the configuration ❌'
            echo '::error::Refusing to guess which hooks run:' \
              'reporting a pass for a set this action could not' \
              'determine would be the green check that linted' \
              'nothing.'
            exit 1
          fi
          # A requested name goes when the EXCLUSIONS are why it will
          # not run: the configuration declares it, nothing runnable
          # answers to it in the listing, and either every instance
          # was excluded or an excluded instance was a runnable one.
          # The last test is what separates an exclusion from stage
          # alone. A name that never had a runnable instance is KEPT,
          # whatever else was excluded, and the preflight in the lint
          # step refuses it. Two false passes came from blurring that:
          #
          #   'hooks: msg-check' plus any unrelated exclusion -- a
          #   stale skip_hooks entry, an ambient SKIP -- became a
          #   green no-op, and 'ok-hook, msg-check' was narrowed to
          #   the half that runs
          #
          #   two commit-msg hooks sharing an id, one excluded by
          #   alias, read as a removed name while the other was still
          #   selected and could never run
          #
          # A name the configuration never declares is NOT dropped.
          # It must reach prek, which refuses it loudly; filtering it
          # out here would turn 'hooks: typo' into a green no-op.
          #
          # Compared on exact strings, never by substring. The names
          # on one side come from the CONFIGURATION and are held to
          # no allow-list; those on the other have passed one. A
          # ' id ' containment test over a space-joined string would
          # match across element boundaries the moment a name held a
          # space.
          #
          # '--no-config' because 'uv run' -- unlike 'uvx' -- reads a
          # 'uv.toml' from the working directory, which here is the
          # checkout being linted. That file can redirect the package
          # index, so the repository under test could otherwise
          # choose where this action's own tooling comes from.
          compare_status=0
          hooks=$(PREK_REQUESTED="$hooks" \
            uv run --no-config --no-project \
            --with pyyaml==6.0.2 python - \
            "$cfg" "$surviving" <<'PYEOF'
        import json
        import os
        import sys
        from collections import Counter

        import yaml

        # Stages at which 'prek run -- <id>' executes a hook.
        # Measured against prek 0.4.10 with one hook per stage:
        # 'pre-commit' and 'manual' ran, and the other nine --
        # commit-msg, post-checkout, post-commit, post-merge,
        # post-rewrite, pre-merge-commit, pre-push, pre-rebase,
        # prepare-commit-msg -- printed nothing and exited 0.
        #
        # 'manual' belongs here because naming a hook on the command
        # line falls back to that stage (prek 0.2.20). The run-all
        # precheck uses a NARROWER set, since an unqualified
        # 'run --all-files' leaves manual hooks alone.
        #
        # 'commit-msg' joins them when commit_range is set: the lint
        # step then runs the selection at that stage as well, so a
        # name left with only a commit-msg instance still runs and
        # must not be dropped as though excluded.
        RUNNABLE_STAGES = frozenset({'pre-commit', 'manual'}) | (
            frozenset({'commit-msg'})
            if os.environ.get('INPUT_COMMIT_RANGE')
            else frozenset()
        )


        def entry_names(entry):
            '''The names one hook entry answers to: its id and alias.

            A set, so an alias repeating its own id counts once --
            the same rule on both sides of the comparison below.
            '''
            return {
                str(entry[key])
                for key in ('id', 'alias')
                if entry.get(key)
            }


        # prek's legacy stage names, which it still accepts and maps
        # onto the current ones (measured against 0.4.14).
        LEGACY_STAGES = {
            'commit': 'pre-commit',
            'push': 'pre-push',
            'merge-commit': 'pre-merge-commit',
        }


        def config_runnable(repo, hook, default_stages):
            '''Whether the FILE shows this hook entry reaching a run.

            prek's resolution for a local hook, measured against
            0.4.14: 'stages' when non-empty, else 'default_stages'
            when the key is present -- an empty list meaning NO
            stage -- else every stage. A remote hook without explicit
            'stages' takes them from a manifest the file does not
            hold, so it reads as not runnable. That errs toward
            refusing a selection, never toward a green no-op.
            '''
            stages = hook.get('stages')
            if not (isinstance(stages, list) and stages):
                if repo.get('repo') != 'local':
                    return False
                if default_stages is None:
                    return True
                stages = default_stages
            if not isinstance(stages, list):
                return False
            return bool(
                RUNNABLE_STAGES.intersection(
                    LEGACY_STAGES.get(stage, stage)
                    for stage in stages
                    if isinstance(stage, str)
                )
            )


        def declared_counts(path):
            '''Per name: how many hook entries answer to it, and the
            names with at least one entry the file shows as runnable.
            '''
            try:
                with open(path, encoding='utf-8') as handle:
                    cfg = yaml.safe_load(handle) or {}
            except (OSError, ValueError, yaml.YAMLError) as exc:
                sys.exit(f'could not read the configuration: {exc}')
            if not isinstance(cfg, dict):
                sys.exit('configuration is not a YAML mapping')
            default_stages = cfg.get('default_stages')
            counts = Counter()
            was_runnable = set()
            for repo in cfg.get('repos') or []:
                if not isinstance(repo, dict):
                    continue
                for hook in repo.get('hooks') or []:
                    if not isinstance(hook, dict):
                        continue
                    names = entry_names(hook)
                    counts.update(names)
                    if config_runnable(repo, hook, default_stages):
                        was_runnable.update(names)
            return counts, was_runnable


        def listed(path):
            '''What prek reports once the exclusions apply.

            Returns how many listed entries answer to each name, at
            ANY stage, and the set of names with at least one
            runnable instance. prek lists one entry per configured
            instance, a duplicate id included, so a count below the
            declared one means an exclusion removed an instance.
            '''
            try:
                with open(path, encoding='utf-8') as handle:
                    listed = json.load(handle)
            except (OSError, ValueError) as exc:
                sys.exit(f'could not read the hook listing: {exc}')
            if not isinstance(listed, list):
                sys.exit('the hook listing is not a JSON array')
            counts = Counter()
            runnable = set()
            for entry in listed:
                if not isinstance(entry, dict) or not entry.get('id'):
                    sys.exit('the hook listing has an entry with no id')
                # Id AND alias: prek reports them separately, and a
                # request or an exclusion may name either.
                names = entry_names(entry)
                counts.update(names)
                stages = entry.get('stages')
                # A listing without stages predates the field; treat
                # the hook as runnable rather than dropping it.
                if stages is None or RUNNABLE_STAGES.intersection(stages):
                    runnable.update(names)
            return counts, runnable


        declared, was_runnable = declared_counts(sys.argv[1])
        present, runnable = listed(sys.argv[2])
        # Nothing runnable left, and the exclusions account for it:
        # they took every instance, or they took SOME and the file
        # shows a runnable one among the declared. Requiring an
        # actual removal in the second arm means a disagreement
        # between config_runnable and prek -- the file says runnable,
        # the listing says not, nothing excluded -- keeps the name
        # for the preflight to refuse, rather than dropping it into
        # a green no-op.
        excluded = {
            name
            for name in declared
            if name not in runnable
            and (
                present[name] == 0
                or (present[name] < declared[name]
                    and name in was_runnable)
            )
        }
        # 'split()' is exact here: every requested id has passed the
        # [A-Za-z0-9._-] allow-list, so none contains whitespace.
        print(
            ' '.join(
                name
                for name in os.environ['PREK_REQUESTED'].split()
                if name not in excluded
            )
        )
        PYEOF
          ) || compare_status=$?
          rm -rf "$listing_dir"
          if [ "$compare_status" -ne 0 ]; then
            echo '::error::could not compare the hook listings ❌'
            echo '::error::Refusing to guess which hooks run.'
            exit 1
          fi
          if [ -z "$hooks" ]; then
            run_needed='false'
            # Source-neutral. Two sources feed the exclusions that
            # empty this set -- skip_hooks and an ambient
            # SKIP/PREK_SKIP -- and one may do it by removing the
            # only runnable instance of a name, so naming skip_hooks
            # alone misreported the rest.
            no_work_reason='no selected hook remains to run'
            echo "::notice::$no_work_reason; nothing to do ✅"
          fi
        fi

        # The same question for run-all mode, where prek resolves the
        # set rather than this action -- so the emptiness has to be
        # anticipated instead of observed.
        #
        # Excluding every hook is coherent (a caller narrowing a
        # shared configuration down to nothing for one project), and
        # the per-hook path above already treats it as a clean no-op.
        # Left to prek it is not: measured against 0.4.14,
        #
        #   $ prek run --all-files --config cfg.yaml \
        #       --skip always-passes --skip always-fails
        #   error: No hooks found after filtering with the given
        #   selectors
        #   exit=1
        #
        # One input would then mean 'nothing to do' in one mode and
        # 'fail the job' in the other.
        #
        # Ask PREK what survives rather than inferring it from the
        # YAML. An earlier version walked 'repos[].hooks[].id' here,
        # which is not prek's selection: it ignores a hook 'alias',
        # which '--skip' matches, so excluding a hook by alias left
        # this precheck seeing it as remaining and prek seeing
        # nothing. 'prek list' applies the same selectors 'prek run'
        # does, and empty output corresponds exactly to the error
        # above.
        if [ "${#effective_list[@]}" -gt 0 ] &&
          [ "$run_all" = 'true' ]; then
          list_args=()
          for skip_id in "${effective_list[@]}"; do
            list_args+=(--skip "$skip_id")
          done
          list_status=0
          # '--hook-stage pre-commit' to match the run this precheck
          # speaks for. An unqualified 'prek run --all-files'
          # executes pre-commit hooks and leaves every other stage
          # alone -- including 'manual', which the per-hook path DOES
          # reach by naming it, hence the narrower filter here.
          #
          # Without it the listing counted hooks the run would skip:
          # excluding a pre-commit hook by alias left a pre-push twin
          # in the listing, the precheck saw work remaining, the run
          # executed nothing, exited 0, and the summary reported
          # 'all hooks | ✅'.
          remaining=$(uvx --no-config "prek@$INPUT_PREK_VERSION" list \
            --config "$cfg" --hook-stage pre-commit \
            "${list_args[@]+"${list_args[@]}"}") || list_status=$?
          # An empty pre-commit set leaves the commit-msg stage to ask
          # about. With a commit range, a hook surviving there keeps
          # the run needed, for the messages, and the lint step leaves
          # out a pre-commit run that would have nothing to execute.
          # Without one, the run is a no-op either way -- but a
          # commit-msg hook left configured and unchecked is the case
          # the summary promises to name, so the reason names it.
          commit_msg_left=''
          if [ "$list_status" -eq 0 ] && [ -z "$remaining" ]; then
            commit_msg_left=$(uvx --no-config "prek@$INPUT_PREK_VERSION" \
              list --config "$cfg" --hook-stage commit-msg \
              "${list_args[@]+"${list_args[@]}"}") || list_status=$?
          fi
          if [ "$list_status" -eq 0 ] && [ -z "$remaining" ] &&
            { [ -z "$commit_msg_left" ] || [ -z "$INPUT_COMMIT_RANGE" ]; }; then
            run_needed='false'
            no_work_reason='no hook in the configuration remains to'
            no_work_reason="$no_work_reason run"
            if [ -n "$commit_msg_left" ]; then
              # Ids come from the configuration, unvetted, and this
              # reason goes into a single-line GITHUB_OUTPUT record:
              # printable characters only, one line, and the root
              # project's '.:' prefix dropped for readability.
              commit_msg_left=$(printf '%s\n' "$commit_msg_left" |
                sed 's/^\.://' | tr -cd '[:print:]\n' | tr '\n' ' ')
              commit_msg_left="${commit_msg_left% }"
              no_work_reason="$no_work_reason at pre-commit; commit-msg"
              no_work_reason="$no_work_reason hooks are configured but"
              no_work_reason="$no_work_reason were not run: $commit_msg_left."
              no_work_reason="$no_work_reason Set commit_range to check"
              no_work_reason="$no_work_reason commit messages"
            fi
            echo "::notice::$no_work_reason; nothing to do ✅"
          fi
          # A non-zero status is 'could not tell', not 'nothing to
          # do'. Fall through and let the run report it, rather than
          # converting a failed query into a green no-op.
        fi

        if [ "$run_needed" != 'true' ]; then
          # Nothing ran, so report nothing. The documented contract
          # for hooks_run is 'empty when there was nothing to do',
          # and 'all' here would name work that did not happen --
          # which is what the run-all label would otherwise say once
          # the exclusions emptied the configuration. The ci.skip
          # no-op path reaches the same state through an empty
          # $hooks.
          hooks_label=''
        elif [ "$run_all" = 'true' ]; then
          hooks_label='all'
        else
          hooks_label="$hooks"
        fi
        # One selector per line, so an item containing a space
        # survives the round trip. Neither source may contain a
        # newline (both are checked), so it is a safe separator.
        #
        # An unpredictable delimiter, not a fixed word: a selector is
        # caller-supplied and a fixed terminator would itself be a
        # legal one, letting a caller close the record early and have
        # the remainder parsed as workflow commands.
        skip_delim="SKIPS_EOF_$(dd if=/dev/urandom bs=15 count=1 \
          status=none | base64 | tr -d '/+=')"
        config_hash=$(sha256sum "$cfg" | awk '{print $1}')
        {
          echo "config_file=$cfg"
          echo "hooks=$hooks"
          echo "hooks_label=$hooks_label"
          echo "skip_effective<<$skip_delim"
          for skip_id in "${effective_list[@]+"${effective_list[@]}"}"; do
            printf '%s\n' "$skip_id"
          done
          echo "$skip_delim"
          echo "run_all=$run_all"
          echo "run_needed=$run_needed"
          echo "no_work_reason=$no_work_reason"
          echo "config_hash=$config_hash"
        } >> "$GITHUB_OUTPUT"

    - name: 'Prepare Rust toolchain'
      # Located by this id in tests/test-rust-toolchain.sh, which runs
      # the step on its own against a stand-in rustup.
      id: rust
      if: steps.resolve.outputs.run_needed == 'true'
      shell: bash
      env:
        INPUT_PATH_PREFIX: ${{ inputs.path_prefix }}
        INPUT_RUST_TOOLCHAIN_SETUP: ${{ inputs.rust_toolchain_setup }}
        INPUT_RUST_COMPONENTS: ${{ inputs.rust_components }}
      run: |
        # Prepare Rust toolchain
        #
        # pre-commit.ci cannot run cargo, so Rust hooks reach CI here,
        # as 'language: system' hooks calling the rustup proxies. On a
        # GitHub-hosted runner those fail for a project pinning a
        # channel in rust-toolchain.toml without listing components.
        # Measured with rustup 1.29.1, which the runner image ships
        # with its profile set to 'minimal':
        #
        #   $ cargo fmt --check     # proxy auto-installs 1.85.0
        #   error: 'cargo-fmt' is not installed for the toolchain
        #   '1.85.0-x86_64-unknown-linux-gnu'.
        #
        # So install the toolchain the project selects, and add the
        # components the hooks need to THAT toolchain, before prek runs.
        set -euo pipefail
        if [ "$INPUT_RUST_TOOLCHAIN_SETUP" = 'false' ]; then
          echo 'rust_toolchain_setup is false; not preparing Rust 💬'
          exit 0
        fi
        prefix=$(cd -- "$GITHUB_WORKSPACE/$INPUT_PATH_PREFIX" && pwd -P)

        # A Rust project has a TRACKED Cargo.toml under path_prefix:
        # what git holds is what prek lints, and an untracked build
        # artefact must not turn a repository into a Rust one. A
        # directory git does not manage is not one either; prek
        # refuses to run there regardless.
        if [ "$INPUT_RUST_TOOLCHAIN_SETUP" = 'auto' ]; then
          manifests=$(git -C "$prefix" ls-files -- ':(glob)**/Cargo.toml' \
            2> /dev/null) || manifests=''
          if [ -z "$manifests" ]; then
            echo 'No tracked Cargo.toml under path_prefix; not' \
              'preparing Rust 💬'
            exit 0
          fi
        fi

        rows=''
        warnings=()
        prepared=()
        # Printable characters only, with Markdown's active characters
        # escaped: rustc output and toolchain paths come from outside
        # this action and land in table cells and list items.
        md_escape() {
          printf '%s' "$1" | tr -cd '[:print:]' |
            sed 's/[][\\`*_|<>]/\\&/g'
        }
        summary() {
          # $1=outcome line
          {
            echo '## 🦀 Rust Toolchain'
            echo ''
            echo "$1"
            if [ -n "$rows" ]; then
              echo ''
              echo '| Toolchain | Result |'
              echo '| --------- | ------ |'
              printf '%s' "$rows"
            fi
            if [ "${#warnings[@]}" -gt 0 ]; then
              echo ''
              echo 'Warnings:'
              echo ''
              for warning in "${warnings[@]}"; do
                echo "- $warning"
              done
            fi
            echo ''
          } >> "$GITHUB_STEP_SUMMARY"
        }
        fail() {
          # $1=stage, the remaining arguments the message
          local stage="$1"
          shift
          echo "::error::$* ❌"
          summary "❌ Failed at $stage: $(md_escape "$*")"
          exit 1
        }

        if ! command -v rustup > /dev/null 2>&1; then
          if [ "$INPUT_RUST_TOOLCHAIN_SETUP" = 'true' ]; then
            fail 'setup' "rust_toolchain_setup is 'true' but rustup is" \
              'not on PATH'
          fi
          echo '::notice::rustup is not on PATH; the Rust toolchain' \
            'was not prepared'
          outcome='⚠️ Not prepared: rustup is not on PATH, so cargo hooks'
          summary "$outcome run with the toolchain the runner already has"
          exit 0
        fi

        # Never let rustup install a toolchain as a side effect. Asked
        # with this unset, 'rustup show active-toolchain' installs a
        # missing one with the minimal profile, warning that the
        # behaviour is deprecated; with it set, it refuses, so the
        # install below is explicit and happens once.
        export RUSTUP_AUTO_INSTALL=0

        # Where the toolchain is chosen. prek runs every hook from the
        # git top level when given '--config', which the lint step
        # always passes, so a hook's 'cargo' resolves the toolchain
        # there. A hook that changes into path_prefix first resolves
        # it there instead, so prepare both when they differ.
        dirs=("$prefix")
        if top=$(git -C "$prefix" rev-parse --show-toplevel 2> /dev/null) &&
          [ -n "$top" ] && [ "$top" != "$prefix" ]; then
          dirs=("$top" "$prefix")
        fi

        # Validated in the validate step.
        read -ra components <<< "${INPUT_RUST_COMPONENTS//,/ }"

        # Where rustup keeps its toolchains, found as rustup finds it.
        rustup_home="${RUSTUP_HOME:-${HOME:-}/.rustup}"

        for dir in "${dirs[@]}"; do
          # Names the toolchain without running it. A missing one is
          # refused (auto-install is off), and installed here instead:
          # with no argument, rustup 1.28+ installs the toolchain the
          # directory selects, components its toolchain file lists
          # included. Never on a toolchain already present, where it
          # would sync the channel and could update it mid-run.
          # rustup before 1.28 predates RUSTUP_AUTO_INSTALL and still
          # installs a missing toolchain on 'show active-toolchain'
          # (checked with 1.27.1), so it never reaches this branch.
          if ! active=$(cd -- "$dir" && rustup show active-toolchain); then
            echo "Installing the toolchain selected in $dir 💬"
            if ! (cd -- "$dir" &&
              rustup toolchain install --no-self-update); then
              fail 'install' 'could not install the Rust toolchain' \
                "selected in $dir"
            fi
            if ! active=$(cd -- "$dir" &&
              rustup show active-toolchain); then
              fail 'resolve' 'could not resolve the Rust toolchain' \
                "selected in $dir"
            fi
          fi
          # '<name> (<reason>)' on the first line.
          name="${active%%$'\n'*}"
          name="${name% (*}"
          # A path-based toolchain is a directory the repository
          # names. Adding components to it is not rustup's to do, and
          # running its rustc would execute whatever lives there.
          case "$name" in
            /*)
              warning="the toolchain selected in $dir is a path; not"
              warning="$warning preparing it: $name"
              echo "::warning::$warning"
              warnings+=("$(md_escape "$warning")")
              continue
              ;;
          esac
          # The name reaches rustup as an argument and the output as a
          # single-line record, so hold it to what a toolchain name
          # can be, starting alphanumeric so it never reads as an
          # option.
          if ! [[ "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
            fail 'resolve' "rustup named a toolchain for $dir that" \
              'this action does not accept'
          fi
          # 'rustup toolchain link' makes a symlink in rustup's home.
          # rustup refuses 'component add' for such a toolchain
          # ("invalid toolchain name", rustup 1.27.1 and 1.29.1), and
          # what it holds is for whoever linked it to decide, so leave
          # it as found, like a path-based one.
          if [ -L "$rustup_home/toolchains/$name" ]; then
            warning="the toolchain selected in $dir is linked; not"
            warning="$warning preparing it: $name"
            echo "::warning::$warning"
            warnings+=("$(md_escape "$warning")")
            continue
          fi
          for seen in "${prepared[@]+"${prepared[@]}"}"; do
            [ "$seen" = "$name" ] && continue 2
          done
          prepared+=("$name")
          # Idempotent and offline when the components are present.
          if [ "${#components[@]}" -gt 0 ]; then
            echo "::group::rustup component add --toolchain $name" \
              "${components[*]}"
            if ! rustup component add --toolchain "$name" \
              -- "${components[@]}"; then
              echo '::endgroup::'
              fail 'components' 'could not add rust_components to' \
                "$name"
            fi
            echo '::endgroup::'
          fi
          if ! version=$(rustup run "$name" rustc --version); then
            fail 'verify' "rustc does not run from $name"
          fi
          rows="$rows| \`$name\` | ✅ $(md_escape "$version") |"$'\n'
          echo "Rust toolchain ready: $name ($version) ✅"
        done

        echo "toolchains=${prepared[*]+"${prepared[*]}"}" >> "$GITHUB_OUTPUT"
        if [ "${#prepared[@]}" -eq 0 ]; then
          summary '⚠️ Not prepared: the selected toolchain is a path or linked'
        else
          summary "✅ Prepared ${#prepared[@]} toolchain(s)"
        fi

    - name: 'Cache prek hook environments'
      if: steps.resolve.outputs.run_needed == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/prek
        # yamllint disable-line rule:line-length
        key: prek-${{ runner.os }}-${{ inputs.prek_version }}-${{ steps.resolve.outputs.config_hash }}
        restore-keys: |
          prek-${{ runner.os }}-${{ inputs.prek_version }}-

    - name: 'Run linting checks'
      id: lint
      if: steps.resolve.outputs.run_needed == 'true'
      shell: bash
      env:
        CONFIG_FILE: ${{ steps.resolve.outputs.config_file }}
        RESOLVED_HOOKS: ${{ steps.resolve.outputs.hooks }}
        HOOKS_LABEL: ${{ steps.resolve.outputs.hooks_label }}
        SKIP_EFFECTIVE: ${{ steps.resolve.outputs.skip_effective }}
        RUN_ALL: ${{ steps.resolve.outputs.run_all }}
        PER_HOOK_RUNS: ${{ inputs.per_hook_runs }}
        INPUT_PATH_PREFIX: ${{ inputs.path_prefix }}
        INPUT_BRANCH_NAME: ${{ inputs.branch_name }}
        INPUT_PREK_VERSION: ${{ inputs.prek_version }}
        INPUT_COMMIT_RANGE: ${{ inputs.commit_range }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        # Run linting checks
        set -euo pipefail
        # Hooks probing for a token behave better with the variables
        # absent than empty.
        if [ -z "${GITHUB_TOKEN:-}" ]; then
          unset GITHUB_TOKEN GH_TOKEN
        fi
        export PREK_HOME="$HOME/.cache/prek"
        cd "$INPUT_PATH_PREFIX"
        if [ -n "$INPUT_BRANCH_NAME" ]; then
          echo "Checking out Git branch: $INPUT_BRANCH_NAME 💬"
          git checkout -b "$INPUT_BRANCH_NAME"
        fi
        status=0
        rows=''
        # Counted per branch below, then published. Starts at zero so
        # the per-hook loop can add as it goes; the two single-shot
        # branches assign directly.
        invocations=0
        # '--skip' is forwarded on BOTH paths.
        #
        # An earlier revision passed it on the run-all path alone,
        # reasoning that the resolver had already removed exclusions
        # from the per-hook list so the flag was redundant there --
        # and worse than redundant, because
        # 'prek run --skip X -- X' exits 1 rather than selecting
        # nothing, so a filter bug would have become a false failure.
        #
        # That reasoning assumed one instance per id. prek allows a
        # hook id to appear MORE THAN ONCE, and matches a selector
        # against either the id or an alias:
        #
        #   $ prek list --config cfg.yaml
        #   .:dup
        #   .:dup
        #   $ prek run --config cfg.yaml -- dup
        #   dup A...................................Passed
        #   dup B...................................Passed
        #   $ prek run --config cfg.yaml --skip first-one -- dup
        #   dup B...................................Passed
        #
        # So when an alias excludes ONE instance, the id survives in
        # the resolved list -- correctly, the other instance must
        # still run -- and a bare 'run -- dup' then re-selects both
        # and runs the excluded one. Forwarding the exclusions is
        # what keeps the surviving instance without the excluded one.
        #
        # The old objection no longer applies: an id whose EVERY
        # instance was excluded is absent from the surviving listing,
        # so the resolver has already dropped it and the loop never
        # names it.
        #
        # Built as an ARRAY: a single string would either word-split
        # unquoted -- taking pathname expansion with it -- or arrive
        # as one argument when quoted, and prek takes one id per
        # '--skip'.
        #
        # Two grammars share this list, so it is NOT held to one
        # rule. 'skip_hooks' was gated to [A-Za-z0-9._-] on the way
        # in; the ambient 'SKIP'/'PREK_SKIP' entries deliberately
        # were not, because they carry prek SELECTORS -- 'frontend/'
        # names a project, 'frontend:eslint' a qualified hook, and
        # 'frontend app/' holds a space. Narrowing them to the
        # hook-id allow-list would reject workspace callers prek
        # serves happily. What the resolver refused for them instead
        # is what cannot be forwarded safely: control characters, and
        # a leading '-' that would read as an option.
        #
        # Quoting carries the rest, which is why each element is read
        # whole and expanded quoted below.
        skip_args=()
        if [ -n "$SKIP_EFFECTIVE" ]; then
          # One selector per LINE. Splitting on IFS would break an
          # item containing a space -- prek splits SKIP/PREK_SKIP on
          # commas alone, so 'frontend app/' is one selector.
          while IFS= read -r skip_id; do
            [ -n "$skip_id" ] || continue
            skip_args+=(--skip "$skip_id")
            echo "Skipping: $skip_id 💬"
          done <<< "$SKIP_EFFECTIVE"
        fi
        # commit_range, resolved to the commits it selects BEFORE
        # anything runs. A range this clone cannot walk in full is
        # refused, never linted in part: quietly checking three of a
        # pull request's ten messages is the green check that linted
        # less than it claims.
        #
        # Each side passed the validate step's allow-list. Both are
        # resolved to commit ids behind '--end-of-options', and only
        # those ids reach git from here on.
        commits=()
        if [ -n "$INPUT_COMMIT_RANGE" ]; then
          range_from=$(git rev-parse --verify --quiet --end-of-options \
            "${INPUT_COMMIT_RANGE%%..*}^{commit}") || range_from=''
          range_to=$(git rev-parse --verify --quiet --end-of-options \
            "${INPUT_COMMIT_RANGE#*..}^{commit}") || range_to=''
          if [ -z "$range_from" ] || [ -z "$range_to" ]; then
            echo '::error::commit_range names a revision this clone' \
              "does not hold: $INPUT_COMMIT_RANGE ❌"
            echo '::error::Check out with fetch-depth: 0, or fetch' \
              'both ends of the range, so every commit in it can be' \
              'checked.'
            exit 1
          fi
          range_list=$(git rev-list --reverse "$range_to" "^$range_from")
          if [ -z "$range_list" ]; then
            echo '::error::commit_range selects no commits:' \
              "$INPUT_COMMIT_RANGE ❌"
            echo '::error::A reversed range, or one whose ends are' \
              'the same commit, selects nothing. Refusing rather than' \
              'report a check of commit messages that checked none.'
            exit 1
          fi
          # A shallow clone ends a walk at its boundary, a commit whose
          # parents were never fetched, and that breaks the range in
          # BOTH directions:
          #
          #   above 'from': the walk stops short. Measured with git
          #   2.53, a four-commit range in a clone one commit deep
          #   listed ONE commit and exited 0.
          #
          #   below 'from': '^from' cannot exclude ancestry it never
          #   saw. With 'from' a shallow side branch, 'from..to'
          #   listed four commits where the range holds two, and
          #   linted messages it was never asked about.
          #
          # Telling the harmless boundaries from these is not worth
          # the risk, so ANY boundary reachable from either end is
          # refused. The action's own checkout fetches full history
          # when a range is set, and holds none.
          # Read in full before matching, not piped: 'grep -q' stops at
          # its first match, a long walk then dies of SIGPIPE, and
          # under pipefail that failure would read as 'no boundary'.
          if [ "$(git rev-parse --is-shallow-repository)" = 'true' ]; then
            reachable=$(git rev-list "$range_to" "$range_from")
          else
            reachable=''
          fi
          if [ -n "$reachable" ] &&
            grep -qxFf "$(git rev-parse --git-path shallow)" \
              <<< "$reachable"; then
            echo '::error::commit_range meets the boundary of this' \
              "shallow clone: $INPUT_COMMIT_RANGE ❌"
            echo '::error::History beyond a boundary was never' \
              'fetched, so the commits this range selects cannot be' \
              'told apart from the rest, and checking a guess would' \
              'report the range as clean. Check out with' \
              'fetch-depth: 0.'
            exit 1
          fi
          mapfile -t commits <<< "$range_list"
          echo "Commit messages to check: ${#commits[@]} 💬"
        fi
        # Which named hooks each stage runs. Without commit_range
        # every survivor of the preflight runs at pre-commit; with it
        # the preflight splits them by the stages they declare.
        pre_commit_hooks="$RESOLVED_HOOKS"
        commit_msg_hooks=''
        # Every hook this run was asked for must be one prek will
        # actually execute. Two ways it might not be, and prek
        # reports neither as a failure.
        #
        # UNDEFINED. A selector matching nothing is an error when it
        # is alone and a warning once another matches:
        #
        #   $ prek run ... -- no-such-hook
        #   error: No hooks found after filtering    exit 1
        #
        #   $ prek run ... -- always-passes no-such-hook
        #   warning: selector `no-such-hook` did not match any
        #   Always passes.......................Passed    exit 0
        #
        # UNREACHABLE. A hook exists but declares only stages a run
        # never enters. Measured with one hook per stage, naming
        # each: 'pre-commit' and 'manual' ran; the other nine
        # printed nothing and exited 0. So a commit-msg hook such as
        # gitlint collects a tick without running, and a hook whose
        # entry is 'false' -- one that cannot pass -- reports a pass.
        # commit_range adds commit-msg to the stages a run reaches,
        # through a run of its own per commit below.
        #
        # Both are the green check that linted nothing, so both fail
        # the run here and name what was wrong.
        #
        # Runs for BOTH named-hook shapes. The per-hook loop refuses
        # an undefined id on its own, one selector at a time, but
        # nothing in either shape notices an unreachable stage.
        #
        # Asked HERE rather than in the resolver because 'prek list'
        # initialises hooks, cloning any remote repository the
        # exclusions have not removed. The resolver runs before the
        # cache is restored -- it produces the key that step uses --
        # so asking there made every selected-hooks run clone
        # uncached. This step is past the restore.
        #
        # Carrying the SAME exclusions as the run, so it sees what
        # the run sees: aliases, and a hook whose stages come from a
        # remote manifest, neither of which reading the configuration
        # would find.
        if [ "$RUN_ALL" != 'true' ] && [ -n "$RESOLVED_HOOKS" ]; then
          known_dir=$(mktemp -d "$RUNNER_TEMP/prek-known.XXXXXXXX")
          known_json="$known_dir/known.json"
          # To a FILE, matching the resolver: prek's JSON carries
          # each hook's name, description and stage list, and Linux
          # caps a single environment string near 128 KiB.
          if ! uvx --no-config "prek@$INPUT_PREK_VERSION" list \
            --config "$CONFIG_FILE" --output-format json \
            "${skip_args[@]+"${skip_args[@]}"}" > "$known_json"; then
            echo '::error::could not list the hooks this run would' \
              'execute ❌'
            echo '::error::Refusing to run a selection this action' \
              'could not check: an undefined or unreachable hook' \
              'would then report a pass having run nothing.'
            exit 1
          fi
          check_status=0
          verdict=$(REQUESTED="$RESOLVED_HOOKS" \
            uv run --no-config --no-project python - \
            "$known_json" <<'PYEOF') || check_status=$?
        import json
        import os
        import sys

        # Stages a run reaches when it NAMES a hook. Naming one falls
        # back to the manual stage (prek 0.2.20), which an unqualified
        # run-all does not -- but run-all never reaches this check.
        PRE_COMMIT_STAGES = frozenset({"pre-commit", "manual"})
        # Reached as well when commit_range is set, by the run that
        # checks each commit's message.
        COMMIT_MSG_STAGES = (
            frozenset({"commit-msg"})
            if os.environ.get("INPUT_COMMIT_RANGE")
            else frozenset()
        )

        try:
            with open(sys.argv[1], encoding="utf-8") as handle:
                listed = json.load(handle)
        except (OSError, ValueError) as exc:
            sys.exit(f"could not read the hook listing: {exc}")
        if not isinstance(listed, list):
            sys.exit("the hook listing is not a JSON array")

        # A name may reach several hooks: prek permits a duplicate id,
        # and an alias names one instance of it. Collect the stages of
        # every instance a name reaches, so one runnable instance is
        # enough to keep the name -- at each stage it reaches.
        stages_for = {}
        for entry in listed:
            if not isinstance(entry, dict) or not entry.get("id"):
                sys.exit("the hook listing has an entry with no id")
            stages = entry.get("stages")
            # Absent means every stage.
            every = not isinstance(stages, list)
            at_pre_commit = every or bool(
                PRE_COMMIT_STAGES.intersection(stages)
            )
            at_commit_msg = bool(COMMIT_MSG_STAGES) and (
                every or bool(COMMIT_MSG_STAGES.intersection(stages))
            )
            seen = [s for s in (stages or []) if isinstance(s, str)]
            for key in ("id", "alias"):
                value = entry.get(key)
                if value:
                    name = str(value)
                    hit = stages_for.setdefault(
                        name,
                        {
                            "pre-commit": False,
                            "commit-msg": False,
                            "stages": set(),
                        },
                    )
                    hit["pre-commit"] = hit["pre-commit"] or at_pre_commit
                    hit["commit-msg"] = hit["commit-msg"] or at_commit_msg
                    hit["stages"].update(seen)

        undefined = []
        unreachable = []
        pre_commit = []
        commit_msg = []
        for name in os.environ["REQUESTED"].split():
            hit = stages_for.get(name)
            if hit is None:
                undefined.append(name)
            elif not (hit["pre-commit"] or hit["commit-msg"]):
                stages = "/".join(sorted(hit["stages"])) or "none"
                unreachable.append(f"{name} ({stages})")
            else:
                if hit["pre-commit"]:
                    pre_commit.append(name)
                if hit["commit-msg"]:
                    commit_msg.append(name)
        print(" ".join(undefined))
        print(" ".join(unreachable))
        print(" ".join(pre_commit))
        print(" ".join(commit_msg))
        PYEOF
          rm -rf "$known_dir"
          # A failed CHECK is not a bad hook name. Reporting it as
          # one would name a diagnostic among the caller's hook ids;
          # reporting nothing would let the run proceed unchecked,
          # which is what this exists to prevent.
          if [ "$check_status" -ne 0 ]; then
            echo '::error::could not check the requested hooks' \
              'against the configuration ❌'
            exit 1
          fi
          undefined=$(printf '%s' "$verdict" | sed -n '1p')
          unreachable=$(printf '%s' "$verdict" | sed -n '2p')
          pre_commit_hooks=$(printf '%s' "$verdict" | sed -n '3p')
          commit_msg_hooks=$(printf '%s' "$verdict" | sed -n '4p')
          if [ -n "$undefined" ]; then
            echo "::error::requested hooks the configuration does" \
              "not define: $undefined ❌"
            echo '::error::prek reports an unmatched selector as a' \
              'warning when another matches, so this run would have' \
              'passed while linting less than it was asked to.' \
              'Correct the name, or drop it from the hooks input.'
            exit 1
          fi
          if [ -n "$unreachable" ]; then
            echo "::error::requested hooks run at no stage this" \
              "action reaches: $unreachable ❌"
            echo '::error::A run executes pre-commit hooks, manual' \
              'ones when named, and commit-msg ones when commit_range' \
              'is set. prek passes over the rest without output and' \
              'exits 0, so this run would have reported a pass' \
              'without executing them.'
            case "$unreachable" in
              *commit-msg*)
                if [ -z "$INPUT_COMMIT_RANGE" ]; then
                  echo '::error::Set commit_range to check commit' \
                    'messages with a commit-msg hook such as gitlint.'
                fi
                ;;
            esac
            echo '::error::Run hooks at any other stage in a' \
              'dedicated job.'
            exit 1
          fi
        fi

        # Run-all hands prek the whole configuration, so ask prek
        # which stages its hooks reach, with the run's exclusions --
        # ONE listing, every stage, as each hook resolves them
        # ('default_stages' applied).
        #
        # With a range, it says whether any message has a hook to
        # check it, and whether the pre-commit run has anything to
        # execute. A configuration of commit-msg hooks alone would
        # otherwise get a pre-commit run that executed nothing,
        # exited 0, and recorded 'all hooks | ✅'.
        #
        # Without a range, a hook ONLY commit-msg reaches is
        # configured and never checked -- and the summary says so,
        # rather than leaving a green check to imply it ran.
        run_all_pre_commit='true'
        run_all_commit_msg='false'
        unchecked_commit_msg=''
        if [ "$RUN_ALL" = 'true' ]; then
          msg_list_dir=$(mktemp -d "$RUNNER_TEMP/prek-msg.XXXXXXXX")
          msg_list_json="$msg_list_dir/stages.json"
          msg_list_status=0
          uvx --no-config "prek@$INPUT_PREK_VERSION" list \
            --config "$CONFIG_FILE" --output-format json \
            "${skip_args[@]+"${skip_args[@]}"}" > "$msg_list_json" ||
            msg_list_status=$?
          if [ "$msg_list_status" -eq 0 ]; then
            msg_verdict=$(uv run --no-config --no-project python - \
              "$msg_list_json" <<'PYEOF'
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as handle:
            listed = json.load(handle)
        if not isinstance(listed, list):
            sys.exit("the hook listing is not a JSON array")
        pre_commit = False
        commit_msg = False
        # Run-all reaches pre-commit alone, so a hook at commit-msg
        # and not there is one that only a commit-msg run executes.
        only = []
        for entry in listed:
            stages = entry.get("stages") if isinstance(entry, dict) else None
            # A listing without stages predates the field: every stage.
            if not isinstance(stages, list):
                pre_commit = commit_msg = True
                continue
            pre_commit = pre_commit or "pre-commit" in stages
            if "commit-msg" in stages:
                commit_msg = True
                # Unvetted, and bound for a notice: printable only.
                name = "".join(
                    ch for ch in str(entry.get("id") or "") if ch.isprintable()
                )
                if "pre-commit" not in stages and name and name not in only:
                    only.append(name)
        print("true" if pre_commit else "false")
        print("true" if commit_msg else "false")
        print(" ".join(only))
        PYEOF
            ) || msg_list_status=$?
          fi
          rm -rf "$msg_list_dir"
          if [ "$msg_list_status" -ne 0 ]; then
            # Without a range this only feeds a notice, and the run
            # reports for itself. With one, it decides whether any
            # message is checked, so it must not be guessed.
            if [ -n "$INPUT_COMMIT_RANGE" ]; then
              echo "::error::could not list the stages this" \
                "configuration's hooks run at ❌"
              exit 1
            fi
          else
            run_all_pre_commit=$(printf '%s' "$msg_verdict" | sed -n '1p')
            run_all_commit_msg=$(printf '%s' "$msg_verdict" | sed -n '2p')
            if [ -z "$INPUT_COMMIT_RANGE" ]; then
              unchecked_commit_msg=$(printf '%s' "$msg_verdict" |
                sed -n '3p')
            fi
          fi
        fi

        # Run-all with nothing at any stage this run reaches: every
        # hook at pre-push, say, or commit-msg hooks with no range.
        # prek would execute nothing and exit 0, and publishing 'all'
        # would claim every hook ran. A clean no-op instead, as when
        # exclusions empty the configuration: outputs empty, and the
        # summary saying why.
        if [ "$RUN_ALL" = 'true' ] && [ "$run_all_pre_commit" = 'false' ] &&
          { [ -z "$INPUT_COMMIT_RANGE" ] ||
            [ "$run_all_commit_msg" != 'true' ]; }; then
          reason='no hook in the configuration runs at a stage this'
          reason="$reason action reaches"
          if [ -n "$unchecked_commit_msg" ]; then
            reason="$reason; commit-msg hooks are configured but were"
            reason="$reason not run: $unchecked_commit_msg. Set"
            reason="$reason commit_range to check commit messages"
          fi
          echo "::notice::$reason; nothing to do ✅"
          {
            echo '## 🧹 Standalone Linting'
            echo ''
            echo "No hooks to run: $reason ✅"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        # Published HERE, past the preflight, rather than straight
        # from the resolver. hooks_run reports what ran, and every
        # refusal above exits before prek runs anything -- so a
        # caller reading it after continue-on-error was told that a
        # refused hook had run. From this point each named hook is
        # invoked, so the label holds even when one fails: a failing
        # hook still ran.
        echo "hooks_run=$HOOKS_LABEL" >> "$GITHUB_OUTPUT"

        # The pre-commit stage. A selection may hold nothing for it --
        # 'hooks: gitlint' with a commit range, or run-all over
        # commit-msg hooks alone -- and an EMPTY named one must not
        # reach prek: 'prek run' with no selector runs every hook in
        # the configuration. Run-all reaching here with nothing at
        # pre-commit has commit-msg work and a range, by the no-op
        # above.
        if [ "$RUN_ALL" = 'true' ] && [ "$run_all_pre_commit" = 'false' ]; then
          echo 'No hook remains to run at pre-commit 💬'
        elif [ "$RUN_ALL" = 'true' ]; then
          if uvx --no-config "prek@$INPUT_PREK_VERSION" run --all-files \
            --show-diff-on-failure --config "$CONFIG_FILE" \
            "${skip_args[@]+"${skip_args[@]}"}"; then
            rows=$'| all hooks | ✅ |\n'
          else
            rows=$'| all hooks | ❌ |\n'
            status=1
          fi
          invocations=1
        elif [ -z "$pre_commit_hooks" ]; then
          echo 'No selected hook runs at pre-commit 💬'
        elif [ "$PER_HOOK_RUNS" != 'true' ]; then
          # ONE invocation for the whole selection, which is the
          # default. prek runs hooks concurrently and shares their
          # environments, so the loop below paid a process start and
          # a configuration parse per hook for no added isolation.
          # Measured on four hooks: 418ms looping, 90ms combined.
          #
          # The summary gets one row, since a single exit status
          # covers the selection. prek's own output still names what
          # failed -- 'Twin that always fails...Failed' followed by
          # its hook id -- so this trades the table, not the
          # diagnosis. per_hook_runs restores the table.

          read -ra hook_list <<< "$pre_commit_hooks"
          echo "::group::prek run $pre_commit_hooks"
          # '--' terminates option parsing, for the reason given on
          # the per-hook branch below.
          if uvx --no-config "prek@$INPUT_PREK_VERSION" run --all-files \
            --show-diff-on-failure --config "$CONFIG_FILE" \
            "${skip_args[@]+"${skip_args[@]}"}" \
            -- "${hook_list[@]}"; then
            rows="| $pre_commit_hooks | ✅ |"$'\n'
          else
            rows="| $pre_commit_hooks | ❌ |"$'\n'
            status=1
          fi
          echo '::endgroup::'
          invocations=1
        else
          read -ra hook_list <<< "$pre_commit_hooks"
          for hook in "${hook_list[@]}"; do
            echo "::group::prek run $hook"
            # '--' terminates option parsing: without it a hook id
            # beginning '-' would be read as a prek option, and
            # 'run --help' exits 0, reporting a pass for a hook that
            # never ran. Validation rejects such ids too; this is the
            # second of the two locks.
            if uvx --no-config "prek@$INPUT_PREK_VERSION" run --all-files \
              --show-diff-on-failure --config "$CONFIG_FILE" \
              "${skip_args[@]+"${skip_args[@]}"}" \
              -- "$hook"; then
              rows="$rows| $hook | ✅ |"$'\n'
            else
              rows="$rows| $hook | ❌ |"$'\n'
              status=1
            fi
            echo '::endgroup::'
            invocations=$((invocations + 1))
          done
        fi

        # The commit-msg stage: one prek run per commit, oldest
        # first, each against that commit's message.
        #
        # One per commit because a commit-msg hook takes ONE message
        # file -- prek passes '--commit-msg-filename' to the hook as
        # its argument. '--from-ref'/'--to-ref' select FILES for the
        # other stages and enumerate no messages.
        #
        # '--hook-stage', not prek 0.3's '--stage': 0.2.20, the
        # documented floor, knows only the former, and every later
        # release measured (0.3.0, 0.4.14) still accepts it.
        notes=''
        if [ "${#commits[@]}" -gt 0 ]; then
          commit_msg_args=()
          if [ "$RUN_ALL" = 'true' ]; then
            [ "$run_all_commit_msg" = 'true' ] || commits=()
          elif [ -n "$commit_msg_hooks" ]; then
            read -ra commit_msg_list <<< "$commit_msg_hooks"
            commit_msg_args=(-- "${commit_msg_list[@]}")
          else
            commits=()
          fi
          if [ "${#commits[@]}" -eq 0 ]; then
            # Distinct from 'configured but not run', which a missing
            # commit_range produces: here the range was given and no
            # selected hook declares the stage.
            notes='No selected hook runs at the commit-msg stage, so'
            notes="$notes no commit message was checked."
            echo "::notice::$notes"
          fi
        fi
        if [ "${#commits[@]}" -gt 0 ]; then
          msg_dir=$(mktemp -d "$RUNNER_TEMP/commit-msg.XXXXXXXX")
          msg_file="$msg_dir/COMMIT_EDITMSG"
          # gitlint, the common commit-msg hook, refuses to run without
          # a configured identity -- 'Missing git configuration: please
          # set user.name', exit 254 -- and a CI runner has none. Give
          # each run the identity of the commit's AUTHOR, as at the
          # author's own commit, through GIT_CONFIG_COUNT: scoped to
          # that one process and written nowhere. Appended after any
          # entries the caller already set, which keep their meaning.
          config_base="${GIT_CONFIG_COUNT:-0}"
          case "$config_base" in
            ''|*[!0-9]*)
              echo '::error::GIT_CONFIG_COUNT must be a number ❌'
              exit 1
              ;;
          esac
          config_base=$((10#$config_base))
          for sha in "${commits[@]}"; do
            # The message exactly as committed: the commit object
            # with its headers removed. 'git log' would apply
            # log.showSignature and similar display settings.
            git cat-file commit "$sha" | sed '1,/^$/d' > "$msg_file"
            author_name=$(git log -1 --no-show-signature \
              --format='%an' "$sha")
            author_email=$(git log -1 --no-show-signature \
              --format='%ae' "$sha")
            echo "::group::prek run --hook-stage commit-msg ${sha:0:12}"
            if env GIT_CONFIG_COUNT=$((config_base + 2)) \
              "GIT_CONFIG_KEY_$config_base=user.name" \
              "GIT_CONFIG_VALUE_$config_base=$author_name" \
              "GIT_CONFIG_KEY_$((config_base + 1))=user.email" \
              "GIT_CONFIG_VALUE_$((config_base + 1))=$author_email" \
              uvx --no-config "prek@$INPUT_PREK_VERSION" run \
              --hook-stage commit-msg --all-files \
              --commit-msg-filename "$msg_file" --config "$CONFIG_FILE" \
              "${skip_args[@]+"${skip_args[@]}"}" \
              "${commit_msg_args[@]+"${commit_msg_args[@]}"}"; then
              rows="$rows| commit-msg ${sha:0:12} | ✅ |"$'\n'
            else
              rows="$rows| commit-msg ${sha:0:12} | ❌ |"$'\n'
              status=1
            fi
            echo '::endgroup::'
            invocations=$((invocations + 1))
          done
          rm -rf "$msg_dir"
        fi
        if [ -n "$unchecked_commit_msg" ]; then
          notes='commit-msg hooks are configured but were not run:'
          notes="$notes $unchecked_commit_msg. Set commit_range to"
          notes="$notes check commit messages."
          echo "::notice::$notes"
        fi
        # Published so a caller -- and this action's own fixtures --
        # can see the execution SHAPE. hooks_run cannot show it: the
        # resolver produces that, and it names the same set whichever
        # way the hooks were invoked, so a broken mode switch would
        # leave it unchanged.
        #
        # Counts 'prek run' alone. The preflight listing above, and
        # the resolver's, decide what to run rather than running it,
        # so folding them in would make the same selection report a
        # different number depending on whether an exclusion was set.
        # Each commit-msg run counts: it is one 'prek run' per commit.
        echo "prek_runs=$invocations" >> "$GITHUB_OUTPUT"
        {
          echo '## 🧹 Standalone Linting'
          echo ''
          echo '| Hook | Result |'
          echo '| ---- | ------ |'
          printf '%s' "$rows"
          echo ''
          if [ -n "$notes" ]; then
            echo "$notes"
            echo ''
          fi
        } >> "$GITHUB_STEP_SUMMARY"
        exit "$status"

    - name: 'Nothing to run'
      if: steps.resolve.outputs.run_needed != 'true'
      shell: bash
      env:
        NO_WORK_REASON: ${{ steps.resolve.outputs.no_work_reason }}
      run: |
        # Nothing to run
        #
        # The reason travels from the resolver rather than being
        # assumed here. Three paths reach this step now -- an empty
        # ci.skip, an explicit subset left with nothing to run, and a
        # configuration left with nothing to run -- and a summary
        # naming ci.skip for the other two sends a caller to look at
        # a key they never used.
        #
        # The last two reasons stay source-neutral: skip_hooks, an
        # ambient SKIP/PREK_SKIP, and an unreachable hook stage all
        # empty the set, so naming one input would misreport the
        # rest.
        {
          echo '## 🧹 Standalone Linting'
          echo ''
          echo "No hooks to run: $NO_WORK_REASON ✅"
        } >> "$GITHUB_STEP_SUMMARY"
