# Fixture configuration for the Rust job in testing.yaml.
#
# The hooks are the ones README.md recommends for Rust projects, kept
# identical so the job tests the advice as well as the action:
# 'language: system' hooks calling the rustup proxies, listed under
# ci.skip because pre-commit.ci has no cargo to call.
#
# The job copies this file into each generated Rust project as its
# .pre-commit-config.yaml, so the action runs the ci.skip hooks by
# default, as it would for a caller. It reaches the checked-out
# test-rust-project through config_path instead.

ci:
  skip: [cargo-fmt, cargo-clippy]

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        files: '\.rs$|(^|/)Cargo\.(toml|lock)$'
        pass_filenames: false
